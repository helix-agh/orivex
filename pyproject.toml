[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "orivex"
version = "0.1.0"
description = "A selective and fast exploratory landscape analysis engine."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Wojciech Achtelik", email = "wachtelik@gmail.com"}]
maintainers = [{name = "Wojciech Achtelik", email = "wachtelik@gmail.com"}]
keywords = [
    "exploratory landscape analysis",
    "ela",
    "black-box optimization",
    "benchmarking",
    "bbob",
    "feature extraction",
    "numpy",
    "pytorch",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7,<10",
    "mkdocs-gen-files>=0.5,<0.6",
    "mkdocstrings[python]>=1.0,<2",
    "pymdown-extensions>=10.15,<11",
    "ruff>=0.16.3",
]
torch = [
    "torch>=2.3",
]
test = [
    "hypothesis>=6.100",
    "pytest>=8",
    "pytest-cov>=5",
]
benchmark = [
    "ioh>=0.3.14,<0.4",
    "matplotlib>=3.8",
    "numdifftools>=0.9.41",
    "pandas>=2.2",
    "pyDOE>=0.3.8,<0.4",
    "SALib>=1.4.5,<1.5",
    "scikit-learn>=1.5",
    "threadpoolctl>=3.6",
]
dev = [
    "hypothesis>=6.100",
    "pre-commit>=4.5",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.16.3",
    "torch>=2.3",
    "ty>=0.0.74",
]

[project.urls]
Homepage = "https://helix-agh.github.io/orivex/"
Documentation = "https://helix-agh.github.io/orivex/"
Repository = "https://github.com/helix-agh/orivex"
Issues = "https://github.com/helix-agh/orivex/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orivex = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src", "tests", "benchmarks"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "PTH", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["orivex"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]
"tests/torch/**" = ["E402"]

[tool.ty.environment]
python-version = "3.10"
root = ["./src"]

[tool.ty.src]
include = ["src"]
