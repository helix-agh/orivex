[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "orivex"
version = "0.0.0"
description = "A correctness-first, selective, and fast exploratory landscape analysis engine."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
torch = [
    "torch>=2.3",
]
test = [
    "hypothesis>=6.100",
    "pytest>=8",
    "pytest-cov>=5",
]
benchmark = [
    "numdifftools>=0.9.41",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "threadpoolctl>=3.6",
]
dev = [
    "hypothesis>=6.100",
    "pre-commit>=4.5",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.16.3",
    "torch>=2.3",
    "ty>=0.0.74",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "PTH", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["orivex"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]
"tests/torch/**" = ["E402"]

[tool.ty.environment]
python-version = "3.10"
root = ["./src"]

[tool.ty.src]
include = ["src"]
